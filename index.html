<!DOCTYPE html>
<html lang="es" class="select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evaluación Interactiva de Tiempos Verbales - Inglés</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reglas anticopia globales adaptadas para iOS (iPhone/iPad) y macOS (Safari) */
        * {
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; /* Bloquea el menú al mantener presionado en iOS */
        }
        
        /* Permitir escritura e interacción únicamente dentro de los campos de texto */
        input {
            -webkit-user-select: text;
            -khtml-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
            -webkit-appearance: none; /* Elimina estilos por defecto de Safari iOS */
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-blue-50 to-slate-100 text-slate-800 min-h-screen py-6 px-4 md:py-10">

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-3xl p-5 md:p-10 border border-slate-100">
        
        <!-- Configuración Interna de Web3Forms (Oculta para los estudiantes) -->
        <!-- REEMPLAZA "TU_WEB3FORMS_ACCESS_KEY_AQUI" CON TU CLAVE REAL DE WEB3FORMS -->
        <input type="hidden" id="web3forms-key" value="bd9b99dc-c72c-4052-a54e-6cd1b8aca3fb">

        <!-- Cabecera -->
        <header class="border-b border-slate-200 pb-6 mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Grammar Quiz</span>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mt-2">English Verb Tenses Test</h1>
                <p class="text-slate-500 text-xs md:text-sm mt-1">Completa los 30 ejercicios escribiendo la forma verbal correcta entre paréntesis.</p>
            </div>
            
            <!-- Contador de progreso e incidencias -->
            <div class="flex items-center justify-between md:justify-end gap-3">
                <div class="bg-slate-50 border border-slate-200 px-3 py-2 md:px-4 md:py-3 rounded-2xl flex items-center gap-2 md:gap-3 flex-1 md:flex-initial">
                    <div class="text-right w-full">
                        <span class="block text-[10px] md:text-xs text-slate-400 font-medium">Progreso</span>
                        <span id="answered-count" class="text-base md:text-lg font-bold text-blue-600">0 / 30</span>
                    </div>
                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs md:text-sm shrink-0">
                        ✍️
                    </div>
                </div>
                <div class="bg-rose-50 border border-rose-200 px-3 py-2 md:px-4 md:py-3 rounded-2xl flex items-center gap-2 md:gap-3 flex-1 md:flex-initial">
                    <div class="text-right w-full">
                        <span class="block text-[10px] md:text-xs text-rose-400 font-medium">Incidencias</span>
                        <span id="incidents-count" class="text-lg font-bold text-rose-600">0</span>
                    </div>
                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-bold text-xs md:text-sm shrink-0">
                        ⚠️
                    </div>
                </div>
            </div>
        </header>

        <!-- Registro de Estudiante -->
        <div id="student-section" class="mb-6 p-4 bg-blue-50/50 border border-blue-200 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="w-full md:w-auto flex-1">
                <label for="student-name" class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre del Estudiante:</label>
                <input type="text" id="student-name" placeholder="Escribe tu nombre completo..." 
                    autocomplete="off" autocapitalize="words" spellcheck="false"
                    class="w-full px-4 py-2 text-sm rounded-xl border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
            </div>
            <button type="button" id="start-btn" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm font-semibold px-6 py-2.5 rounded-xl transition shadow-md">
                Comenzar Prueba
            </button>
        </div>

        <!-- Formulario del Ejercicio -->
        <form id="quiz-form" class="opacity-50 pointer-events-none transition-all duration-300">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8" id="questions-grid">
                <!-- Las preguntas se cargarán dinámicamente -->
            </div>

            <!-- Panel de Control y Botones -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-6 border-t border-slate-200">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <button type="button" id="check-btn" disabled class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-semibold px-8 py-3 rounded-xl shadow-lg shadow-blue-500/25 transition transform active:scale-95">
                        Finalizar y Enviar Prueba
                    </button>
                </div>
                <div id="results-badge" class="hidden text-sm font-bold px-4 py-2 rounded-xl text-center w-full sm:w-auto"></div>
            </div>
        </form>

        <!-- Panel de Desbloqueo de Profesor -->
        <div id="teacher-panel" class="mt-8 pt-6 border-t border-slate-200 hidden">
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                    <h3 class="text-sm font-bold text-amber-900">🔒 Evaluación Bloqueada (Modo Profesor)</h3>
                    <p class="text-xs text-amber-700">Ingresa el PIN de profesor para desbloquear la prueba.</p>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <input type="password" id="teacher-pin" placeholder="PIN" maxlength="4" pattern="[0-9]*" inputmode="numeric" class="w-24 px-3 py-2 text-sm rounded-xl border border-amber-300 text-center font-bold tracking-widest focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <button type="button" id="unlock-btn" class="bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white text-sm font-semibold px-4 py-2 rounded-xl transition">
                        Desbloquear
                    </button>
                </div>
            </div>
            <p id="pin-error" class="text-xs text-rose-500 font-semibold mt-2 hidden text-right">PIN incorrecto. Inténtalo de nuevo.</p>
        </div>

    </div>

    <!-- Script JavaScript -->
    <script>
        const TEACHER_PIN = "3456";

        const exercises = [
            { id: 1, sentence: "She usually {verb} to school by bus.", verb: "go", answer: "goes" },
            { id: 2, sentence: "Yesterday, we {verb} a very good movie.", verb: "watch", answer: "watched" },
            { id: 3, sentence: "Look! The children {verb} football in the garden.", verb: "play", answer: "are playing" },
            { id: 4, sentence: "I {verb} my homework already.", verb: "finish", answer: "have finished" },
            { id: 5, sentence: "If it rains tomorrow, we {verb} at home.", verb: "stay", answer: "will stay" },
            { id: 6, sentence: "He {verb} English for three years.", verb: "study", answer: "has studied" },
            { id: 7, sentence: "When I arrived, they {verb} dinner.", verb: "have", answer: "were having" },
            { id: 8, sentence: "Water {verb} at 100 degrees Celsius.", verb: "boil", answer: "boils" },
            { id: 9, sentence: "Listen! Somebody {verb} at the door.", verb: "knock", answer: "is knocking" },
            { id: 10, sentence: "They {verb} to London next summer.", verb: "travel", answer: "are travelling" },
            { id: 11, sentence: "She {verb} her keys yesterday.", verb: "lose", answer: "lost" },
            { id: 12, sentence: "By the time we got there, the train {verb}.", verb: "leave", answer: "had left" },
            { id: 13, sentence: "I {verb} a car if I save enough money.", verb: "buy", answer: "will buy" },
            { id: 14, sentence: "My brother {verb} coffee every morning.", verb: "drink", answer: "drinks" },
            { id: 15, sentence: "While she {verb}, the phone rang.", verb: "sleep", answer: "was sleeping" },
            { id: 16, sentence: "We {verb} to Paris twice.", verb: "be", answer: "have been" },
            { id: 17, sentence: "Who {verb} this book?", verb: "write", answer: "wrote" },
            { id: 18, sentence: "She {verb} dinner when I called her.", verb: "cook", answer: "was cooking" },
            { id: 19, sentence: "Next year, I {verb} 20 years old.", verb: "be", answer: "will be" },
            { id: 20, sentence: "They {verb} football right now.", verb: "play", answer: "are playing" },
            { id: 21, sentence: "He {verb} never {verb} to Japan.", verb: "be", answer: "has been" },
            { id: 22, sentence: "I {verb} you tomorrow.", verb: "help", answer: "will help" },
            { id: 23, sentence: "The sun {verb} in the east.", verb: "rise", answer: "rises" },
            { id: 24, sentence: "She {verb} French fluently.", verb: "speak", answer: "speaks" },
            { id: 25, sentence: "We {verb} a test when the fire alarm went off.", verb: "write", answer: "were writing" },
            { id: 26, sentence: "They {verb} their house recently.", verb: "paint", answer: "have painted" },
            { id: 27, sentence: "If you study hard, you {verb} the exam.", verb: "pass", answer: "will pass" },
            { id: 28, sentence: "He {verb} a shower at the moment.", verb: "take", answer: "is taking" },
            { id: 29, sentence: "Columbus {verb} America in 1492.", verb: "discover", answer: "discovered" },
            { id: 30, sentence: "I {verb} to music when I study.", verb: "listen", answer: "listen" }
        ];

        const grid = document.getElementById('questions-grid');
        const checkBtn = document.getElementById('check-btn');
        const resultsBadge = document.getElementById('results-badge');
        const answeredCount = document.getElementById('answered-count');
        const incidentsCountEl = document.getElementById('incidents-count');
        const studentNameInput = document.getElementById('student-name');
        const startBtn = document.getElementById('start-btn');
        const quizForm = document.getElementById('quiz-form');
        const teacherPanel = document.getElementById('teacher-panel');
        const teacherPinInput = document.getElementById('teacher-pin');
        const unlockBtn = document.getElementById('unlock-btn');
        const pinError = document.getElementById('pin-error');
        const web3KeyInput = document.getElementById('web3forms-key');

        let studentResponses = JSON.parse(localStorage.getItem('quiz_responses') || '{}');
        let incidentLog = JSON.parse(localStorage.getItem('quiz_incidents_log') || '[]');
        let isExamActive = false;

        // --- MÓDULO ANTICOPIA (COMPATIBLE CON iOS / macOS / WINDOWS / ANDROID) ---
        function registerIncident(reason) {
            if (!isExamActive || localStorage.getItem('quiz_completed') === 'true') return;
            
            const timestamp = new Date().toLocaleTimeString();
            const incidentMessage = `[${timestamp}] ${reason}`;
            incidentLog.push(incidentMessage);
            localStorage.setItem('quiz_incidents_log', JSON.stringify(incidentLog));
            
            incidentsCountEl.textContent = incidentLog.length;
        }

        // 1. Bloquear Clic Derecho / Menú Contextual (Mac & Windows & iOS Long-press)
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            registerIncident('Intento de clic derecho o pulsación larga');
        });

        // 2. Bloquear Atajos de Teclado (Ctrl/Cmd + C, V, X, U, P, etc.)
        document.addEventListener('keydown', (e) => {
            const isCmdOrCtrl = e.ctrlKey || e.metaKey; // MetaKey detecta la tecla Command (⌘) en Mac
            if (
                (isCmdOrCtrl && ['c', 'v', 'x', 'u', 'a', 's', 'p'].includes(e.key.toLowerCase())) ||
                e.key === 'F12' || 
                (isCmdOrCtrl && e.shiftKey && ['i', 'j', 'c'].includes(e.key.toLowerCase()))
            ) {
                e.preventDefault();
                registerIncident(`Intento de atajo prohibido: [${e.key}]`);
            }
        });

        // 3. Bloquear Pegado directo
        document.addEventListener('paste', (e) => {
            e.preventDefault();
            registerIncident('Intento de pegar texto (Paste)');
        });

        // 4. Detección de Cambio de Pestaña / Cambio de app en iPhone y Mac
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                registerIncident('Abandono de pestaña/pantalla (App minimizada o cambio de pestaña)');
            }
        });

        window.addEventListener('blur', () => {
            registerIncident('Pérdida de foco de la ventana');
        });

        // Evento especial para navegadores Safari / iOS cuando se cambia de aplicación
        window.addEventListener('pagehide', () => {
            registerIncident('Cambio de pantalla/aplicación en dispositivo móvil');
        });

        // Renderizar las 30 preguntas
        function renderQuestions() {
            grid.innerHTML = '';
            exercises.forEach((ex) => {
                let formattedSentence = ex.sentence.replace('{verb}', `<span class="text-blue-600 font-semibold bg-blue-50 px-2 py-0.5 rounded">(${ex.verb})</span>`);
                
                const card = document.createElement('div');
                card.className = "question-card p-4 rounded-2xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between transition hover:border-blue-200";
                
                const savedValue = studentResponses[ex.id] || '';
                const isLocked = savedValue !== '';

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-slate-400">#${ex.id}</span>
                            <span class="status-indicator text-xs font-semibold hidden"></span>
                        </div>
                        <label class="block text-sm font-medium text-slate-700 mb-3">${formattedSentence}</label>
                    </div>
                    <div>
                        <input type="text" data-id="${ex.id}" data-answer="${ex.answer}" placeholder="Escribe aquí..." 
                            value="${savedValue}" ${isLocked ? 'disabled' : ''}
                            autocomplete="off" autocapitalize="off" spellcheck="false"
                            class="answer-input w-full px-3.5 py-2 text-sm rounded-xl border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition disabled:bg-slate-200/60 disabled:text-slate-600 disabled:cursor-not-allowed">
                        <div class="correct-hint text-xs text-rose-500 mt-1 hidden font-medium"></div>
                    </div>
                `;
                grid.appendChild(card);
            });

            attachInputListeners();
            updateProgress();
            incidentsCountEl.textContent = incidentLog.length;
        }

        // Actualizar el contador de progreso
        function updateProgress() {
            const inputs = document.querySelectorAll('.answer-input');
            let filled = 0;
            inputs.forEach(i => { if (i.value.trim() !== '') filled++; });
            answeredCount.textContent = `${filled} / ${inputs.length}`;
        }

        // Bloquear respuesta individual al salir o enviar
        function attachInputListeners() {
            const inputs = document.querySelectorAll('.answer-input');
            inputs.forEach(input => {
                const lockInput = () => {
                    const val = input.value.trim();
                    if (val !== '' && !input.disabled) {
                        input.disabled = true;
                        const id = input.getAttribute('data-id');
                        studentResponses[id] = val;
                        localStorage.setItem('quiz_responses', JSON.stringify(studentResponses));
                        updateProgress();
                    }
                };

                input.addEventListener('blur', lockInput);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        input.blur(); // Dispara el evento blur para bloquear
                    }
                });
            });
        }

        // Iniciar prueba
        startBtn.addEventListener('click', () => {
            const name = studentNameInput.value.trim();
            if (name === '') {
                alert('Por favor, ingresa tu nombre para comenzar la prueba.');
                return;
            }
            localStorage.setItem('quiz_student_name', name);
            enableQuiz();
        });

        function enableQuiz() {
            isExamActive = true;
            studentNameInput.disabled = true;
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            quizForm.classList.remove('opacity-50', 'pointer-events-none');
            checkBtn.disabled = false;
        }

        // Enviar resultados vía Web3Forms
        async function sendWeb3FormsNotification(studentName, score, percentage, incidents) {
            const apiKey = web3KeyInput.value.trim();
            if (!apiKey || apiKey === 'TU_WEB3FORMS_ACCESS_KEY_AQUI') return;

            const formData = new FormData();
            formData.append("access_key", apiKey);
            formData.append("subject", `[Evaluación Inglés] - Resultados de ${studentName}`);
            formData.append("from_name", "Sistema de Evaluaciones");
            formData.append("Estudiante", studentName);
            formData.append("Nota Final", `${score} / 30`);
            formData.append("Porcentaje", `${percentage}%`);
            formData.append("Total Incidencias", incidents.length);
            formData.append("Detalle de Incidencias", incidents.length > 0 ? incidents.join('\n') : "Sin incidencias registradas.");

            try {
                await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                });
            } catch (err) {
                console.error("Error al enviar resultados por correo:", err);
            }
        }

        // Comprobar respuestas y finalizar la prueba
        checkBtn.addEventListener('click', async () => {
            isExamActive = false;
            const cards = document.querySelectorAll('.question-card');
            let score = 0;

            cards.forEach(card => {
                const input = card.querySelector('.answer-input');
                const indicator = card.querySelector('.status-indicator');
                const hint = card.querySelector('.correct-hint');
                
                const userVal = input.value.trim().toLowerCase();
                const correctVal = input.getAttribute('data-answer').toLowerCase();

                input.disabled = true;
                indicator.classList.remove('hidden');

                if (userVal === correctVal) {
                    score++;
                    indicator.textContent = '✓ Correcto';
                    indicator.className = 'status-indicator text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full';
                    input.className = 'answer-input w-full px-3.5 py-2 text-sm rounded-xl border border-emerald-300 bg-emerald-50/50 focus:outline-none';
                    hint.classList.add('hidden');
                } else {
                    indicator.textContent = '✗ Incorrecto';
                    indicator.className = 'status-indicator text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full';
                    input.className = 'answer-input w-full px-3.5 py-2 text-sm rounded-xl border border-rose-300 bg-rose-50/50 focus:outline-none';
                    hint.textContent = `Correcta: ${input.getAttribute('data-answer')}`;
                    hint.classList.remove('hidden');
                }
            });

            // Guardar resultados y estado de finalización
            const studentName = localStorage.getItem('quiz_student_name') || 'Estudiante';
            const percentage = Math.round((score / exercises.length) * 100);
            
            localStorage.setItem('quiz_completed', 'true');
            localStorage.setItem('quiz_score', score);

            showResults(studentName, score, percentage, incidentLog.length);
            lockEntireQuiz();

            // Enviar correo mediante Web3Forms
            await sendWeb3FormsNotification(studentName, score, percentage, incidentLog);
        });

        function showResults(name, score, percentage, incidentsCount) {
            resultsBadge.classList.remove('hidden');
            let baseStyle = "text-sm font-bold px-4 py-3 rounded-2xl border ";
            
            let message = `${name} | Nota: ${score}/30 (${percentage}%) | Incidencias: ${incidentsCount}`;
            
            if (score === exercises.length) {
                resultsBadge.className = baseStyle + 'bg-emerald-100 text-emerald-800 border-emerald-200';
                resultsBadge.textContent = `🎉 ¡Perfecto! ` + message;
            } else if (score >= 20) {
                resultsBadge.className = baseStyle + 'bg-blue-100 text-blue-800 border-blue-200';
                resultsBadge.textContent = `👏 ¡Muy bien! ` + message;
            } else {
                resultsBadge.className = baseStyle + 'bg-amber-100 text-amber-800 border-amber-200';
                resultsBadge.textContent = `💪 ` + message;
            }
        }

        function lockEntireQuiz() {
            checkBtn.disabled = true;
            checkBtn.classList.add('opacity-50', 'cursor-not-allowed');
            teacherPanel.classList.remove('hidden');
        }

        // Desbloqueo de profesor mediante PIN
        unlockBtn.addEventListener('click', () => {
            const enteredPin = teacherPinInput.value.trim();
            if (enteredPin === TEACHER_PIN) {
                localStorage.removeItem('quiz_completed');
                localStorage.removeItem('quiz_responses');
                localStorage.removeItem('quiz_student_name');
                localStorage.removeItem('quiz_score');
                localStorage.removeItem('quiz_incidents_log');
                
                studentResponses = {};
                incidentLog = [];
                teacherPinInput.value = '';
                pinError.classList.add('hidden');
                
                alert('La prueba ha sido desbloqueada correctamente por el profesor.');
                location.reload();
            } else {
                pinError.classList.remove('hidden');
            }
        });

        // Cargar estado inicial y mantener persistencia
        window.addEventListener('DOMContentLoaded', () => {
            renderQuestions();

            const savedName = localStorage.getItem('quiz_student_name');
            const isCompleted = localStorage.getItem('quiz_completed') === 'true';

            if (savedName) {
                studentNameInput.value = savedName;
                enableQuiz();
            }

            if (isCompleted) {
                isExamActive = false;
                const score = parseInt(localStorage.getItem('quiz_score') || '0', 10);
                const percentage = Math.round((score / exercises.length) * 100);
                
                const cards = document.querySelectorAll('.question-card');
                cards.forEach(card => {
                    const input = card.querySelector('.answer-input');
                    const indicator = card.querySelector('.status-indicator');
                    const hint = card.querySelector('.correct-hint');
                    
                    const userVal = input.value.trim().toLowerCase();
                    const correctVal = input.getAttribute('data-answer').toLowerCase();

                    input.disabled = true;
                    indicator.classList.remove('hidden');

                    if (userVal === correctVal) {
                        indicator.textContent = '✓ Correcto';
                        indicator.className = 'status-indicator text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full';
                        input.className = 'answer-input w-full px-3.5 py-2 text-sm rounded-xl border border-emerald-300 bg-emerald-50/50 focus:outline-none';
                    } else {
                        indicator.textContent = '✗ Incorrecto';
                        indicator.className = 'status-indicator text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full';
                        input.className = 'answer-input w-full px-3.5 py-2 text-sm rounded-xl border border-rose-300 bg-rose-50/50 focus:outline-none';
                        hint.textContent = `Correcta: ${input.getAttribute('data-answer')}`;
                        hint.classList.remove('hidden');
                    }
                });

                showResults(savedName || 'Estudiante', score, percentage, incidentLog.length);
                lockEntireQuiz();
            }
        });
    </script>
</body>
</html>
